company_profiles:
  闲徕互娱: >-
    闲徕互娱聚焦地方特色休闲竞技产品，覆盖闲来麻将、熊猫四川麻将、闲来广东麻将等地方麻将，以及斗地主等玩法，主要面向三至六线城市用户。其业务特点是地方玩法适配、熟人组局和区域化运营。
  闲来麻将: >-
    闲来麻将是闲徕互娱地方棋牌产品体系的重要品牌，业务侧重地方麻将玩法、熟人组局与区域化运营，产品及用户承接能力比单一交易价格更能反映此次变动的行业影响。
  竞技世界: >-
    竞技世界以JJ比赛和JJ斗地主为核心，长期采用赛事化、竞技化运营，业务覆盖斗地主等全国性大众棋牌品类。
  JJ比赛: >-
    JJ比赛是竞技世界旗下棋牌竞技平台，核心品类包括斗地主等大众棋牌，差异化能力主要来自赛事体系、竞技用户和长期平台运营。
  腾讯棋牌: >-
    腾讯棋牌覆盖欢乐斗地主、欢乐麻将、天天象棋等大众品类，产品分布于原生应用和小游戏等载体，并结合微信与QQ社交关系链运营。
