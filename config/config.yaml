bot:
  webhook_env: DINGTALK_WEBHOOK
  security_keyword: 信源
  request_timeout_seconds: 15
  minimum_send_interval_seconds: 1.2

monitor:
  poll_interval_seconds: 1800
  maximum_item_age_hours: 72
  instant_push_score: 30
  maximum_alerts_per_cycle: 5
  send_on_first_run: false
  database_path: data/newsbot.sqlite3
  log_path: data/newsbot.log

fallback:
  enabled: true
  trigger_when_qipai_sent_below: 2
  maximum_game_per_cycle: 1
  maximum_tech_per_cycle: 1
  minimum_score: 70

daily_backup:
  enabled: true
  send_after: "09:30"
  required_items: 3
  minimum_score: 35

